<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="1040" fill="#ffffff"/>

  <text x="60" y="52" font-size="26" font-weight="700" fill="#0f172a">AIML-03 Two-Stage Recommendation Engine</text>
  <text x="60" y="82" font-size="14" fill="#64748b">MovieLens 100K, CPU only. TensorFlow two-tower retrieval, FAISS index, PyTorch wide and deep ranker, FastAPI serving.</text>

  <!-- row 1: data -->
  <g filter="url(#shadow)">
    <rect x="60" y="120" width="320" height="96" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
    <rect x="440" y="120" width="320" height="96" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
    <rect x="820" y="120" width="320" height="96" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  </g>
  <text x="80" y="152" font-size="17" font-weight="700" fill="#1e1b4b">MovieLens 100K</text>
  <text x="80" y="178" font-size="13" fill="#3730a3">100,000 ratings, 943 users</text>
  <text x="80" y="198" font-size="13" fill="#3730a3">1,682 movies, 19 genres</text>

  <text x="460" y="152" font-size="17" font-weight="700" fill="#1e1b4b">1. Per-user time split</text>
  <text x="460" y="178" font-size="13" fill="#3730a3">last 20 percent by timestamp is test</text>
  <text x="460" y="198" font-size="13" fill="#3730a3">80,000 train / 20,000 test rows</text>

  <text x="840" y="152" font-size="17" font-weight="700" fill="#1e1b4b">2. Feature store (pandas)</text>
  <text x="840" y="178" font-size="13" fill="#3730a3">user and item indices, genre multi-hot</text>
  <text x="840" y="198" font-size="13" fill="#3730a3">popularity, history length, mean rating</text>

  <path d="M 380 168 H 434" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 760 168 H 814" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- fork to towers -->
  <path d="M 980 216 V 242 H 330 V 264" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 980 242 H 870 V 264" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- towers -->
  <g filter="url(#shadow)">
    <rect x="140" y="270" width="380" height="110" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
    <rect x="680" y="270" width="380" height="110" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  </g>
  <text x="160" y="302" font-size="17" font-weight="700" fill="#064e3b">3a. User tower (Keras)</text>
  <text x="160" y="328" font-size="13" fill="#065f46">user id embedding (64 dim)</text>
  <text x="160" y="348" font-size="13" fill="#065f46">plus log history length, mean rating, genre profile</text>

  <text x="700" y="302" font-size="17" font-weight="700" fill="#064e3b">3b. Item tower (Keras)</text>
  <text x="700" y="328" font-size="13" fill="#065f46">item id embedding (64 dim)</text>
  <text x="700" y="348" font-size="13" fill="#065f46">plus genre multi-hot, popularity, mean rating</text>

  <path d="M 330 380 V 424" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 870 380 V 424" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- vectors -->
  <g filter="url(#shadow)">
    <rect x="140" y="430" width="380" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
    <rect x="680" y="430" width="380" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  </g>
  <text x="160" y="462" font-size="17" font-weight="700" fill="#064e3b">User vectors 943 x 64</text>
  <text x="160" y="488" font-size="13" fill="#065f46">L2 normalized, one row per user</text>

  <text x="700" y="462" font-size="17" font-weight="700" fill="#064e3b">Item vectors 1,682 x 64</text>
  <text x="700" y="488" font-size="13" fill="#065f46">L2 normalized, saved as item_embeddings.npy</text>

  <path d="M 330 520 V 612 H 414" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 870 520 V 618 H 786" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- faiss -->
  <g filter="url(#shadow)">
    <rect x="420" y="560" width="360" height="106" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  </g>
  <text x="440" y="592" font-size="17" font-weight="700" fill="#7c2d12">4. FAISS IndexFlatIP</text>
  <text x="440" y="618" font-size="13" fill="#9a3412">exact cosine search over 1,682 items</text>
  <text x="440" y="638" font-size="13" fill="#9a3412">returns top 200 candidates per user</text>

  <path d="M 600 666 V 704" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ranker -->
  <g filter="url(#shadow)">
    <rect x="320" y="710" width="560" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  </g>
  <text x="340" y="742" font-size="17" font-weight="700" fill="#7f1d1d">5. Wide and Deep ranker (PyTorch)</text>
  <text x="340" y="768" font-size="13" fill="#991b1b">embeddings, popularity, genre overlap, bucketed crosses</text>
  <text x="340" y="788" font-size="13" fill="#991b1b">scores the 200 candidates, keeps the top 10</text>

  <!-- cold start -->
  <g filter="url(#shadow)">
    <rect x="910" y="710" width="250" height="100" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>
  <text x="928" y="740" font-size="15" font-weight="700" fill="#334155">Cold start fallback</text>
  <text x="928" y="764" font-size="12" fill="#475569">fewer than 3 interactions</text>
  <text x="928" y="782" font-size="12" fill="#475569">0.6 popularity + 0.4 genre affinity</text>
  <path d="M 908 760 H 890" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 600 810 V 844" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- api -->
  <g filter="url(#shadow)">
    <rect x="320" y="850" width="560" height="90" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.6"/>
  </g>
  <text x="340" y="882" font-size="17" font-weight="700" fill="#0c4a6e">6. FastAPI service on port 8011</text>
  <text x="340" y="908" font-size="13" fill="#075985">GET /health and GET /recommend?user_id=1&amp;k=10</text>
  <text x="340" y="928" font-size="13" fill="#075985">returns item ids, titles, genres, scores and latency</text>

  <line x1="60" y1="972" x2="1140" y2="972" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="998" font-size="12" fill="#64748b">Measured on this machine: two-tower 25 epochs in 73 s, ranker 12 epochs in 19 s, FAISS stage 0.65 ms mean, full pipeline 3.72 ms mean over 250 users.</text>
  <text x="60" y="1018" font-size="12" fill="#64748b">No GPU, no Spark, no Redis, no Triton. pandas builds the features in process and the model is served from the FastAPI process.</text>
</svg>
